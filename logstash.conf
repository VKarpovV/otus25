input {
  beats {
    port => 5044
  }
}

filter {
  if [type] == "apache" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    date {
      match => [ "timestamp", "dd/MMM/yyyy:HH:mm:ss Z" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://192.168.140.134:9200"]
    index => "apache-logs-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "elasticpass"
  }
}
